name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 22

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tienda_online
          POSTGRES_USER: tienda
          POSTGRES_PASSWORD: tienda_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U tienda
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://tienda:tienda_dev@localhost:5432/tienda_online?schema=public

      - run: npm run build

      - run: npm test

      - run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://tienda:tienda_dev@localhost:5432/tienda_online?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-jwt-secret-change-me
