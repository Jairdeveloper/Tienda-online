name: Deploy

on:
  push:
    branches: [main]

env:
  NODE_VERSION: 22

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tienda_online
          POSTGRES_USER: tienda
          POSTGRES_PASSWORD: tienda_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U tienda
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - run: cd apps/api && npm ci

      - name: Install frontend deps
        run: cd apps/web && npm ci

      - run: cd apps/api && npx prisma generate

      - run: cd apps/api && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://tienda:tienda_dev@localhost:5432/tienda_online?schema=public

      - run: cd apps/api && npm run build

      - run: cd apps/api && npm test

      - run: cd apps/api && npm run test:e2e
        env:
          DATABASE_URL: postgresql://tienda:tienda_dev@localhost:5432/tienda_online?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-jwt-secret-change-me

  verify-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: cd apps/api && npm ci

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate

      - name: Apply migrations to production database
        run: cd apps/api && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}

      - name: Wait for Vercel deployment
        run: |
          echo "Vercel auto-deploys on push to main via GitHub integration."
          echo "Checking deployment status..."

      - name: Health check
        env:
          VERCEL_URL: ${{ vars.VERCEL_URL }}
        run: |
          API_URL="${VERCEL_URL:-https://tienda-online.vercel.app}/api/v1/health"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "${API_URL}" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ API healthy (HTTP 200)"
              exit 0
            fi
            echo "  Attempt $i/12: HTTP $STATUS — waiting 10s..."
            sleep 10
          done
          echo "❌ API not healthy after 120s"
          exit 1
